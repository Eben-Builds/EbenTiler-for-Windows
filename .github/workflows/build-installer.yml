name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/make-appicon.ps1'
      - 'tools/prepare-code-signing.ps1'
      - 'tools/verify-installer.ps1'
      - 'tools/verify-release.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - 'LICENSE'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      EBENTILER_SIGNING_CERT_SHA1: ${{ secrets.EBENTILER_SIGNING_CERT_SHA1 }}
      SIGNING_PFX_BASE64: ${{ secrets.EBENTILER_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.EBENTILER_SIGNING_PFX_PASSWORD }}
      EBENTILER_TIMESTAMP_URL: https://timestamp.digicert.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Prepare configured code-signing identity
        shell: powershell
        run: .\tools\prepare-code-signing.ps1

      - name: Build EbenTiler installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify installer outputs
        shell: powershell
        run: |
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe')) { throw 'Installer output is missing.' }
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe.sha256')) { throw 'SHA256 output is missing.' }

          $expected = ((Get-Content '.\dist\EbenTiler-Setup.exe.sha256' -Raw).Split()[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash '.\dist\EbenTiler-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer SHA256 mismatch: $actual" }

      - name: Exercise release verification
        shell: powershell
        run: .\tools\verify-release.ps1

      - name: Smoke test install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbenTiler-Setup
          path: |
            dist\EbenTiler-Setup.exe
            dist\EbenTiler-Setup.exe.sha256
          if-no-files-found: error

      # When no production signing identity is configured, exercise the same
      # SignTool/Inno Setup path with a short-lived local test certificate.
      # This output is never uploaded or published.
      - name: Create ephemeral CI code-signing identity
        if: env.EBENTILER_SIGNING_CERT_SHA1 == '' && env.SIGNING_PFX_BASE64 == ''
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=EbenTiler CI Test Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)

          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'CurrentUser')
          $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          try { $rootStore.Add($cert) } finally { $rootStore.Close() }

          "EBENTILER_SIGNING_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EBENTILER_CI_TEST_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test signed build path
        if: env.EBENTILER_CI_TEST_CERT_SHA1 != ''
        shell: powershell
        run: |
          .\tools\prepare-code-signing.ps1 -RequireSigning
          .\build-installer.ps1
          .\tools\verify-release.ps1 -RequireCodeSigning

      - name: Remove ephemeral CI certificate
        if: always() && env.EBENTILER_CI_TEST_CERT_SHA1 != ''
        shell: powershell
        run: |
          Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $env:EBENTILER_CI_TEST_CERT_SHA1) -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ("Cert:\CurrentUser\Root\" + $env:EBENTILER_CI_TEST_CERT_SHA1) -Force -ErrorAction SilentlyContinue
