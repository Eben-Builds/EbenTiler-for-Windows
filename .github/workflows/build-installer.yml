name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/make-appicon.ps1'
      - 'tools/verify-installer.ps1'
      - 'tools/verify-release.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - 'LICENSE'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      # main CI is intentionally unsigned and never receives release signing secrets.
      - name: Build unsigned EbenTiler installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify installer outputs
        shell: powershell
        run: |
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe')) { throw 'Installer output is missing.' }
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe.sha256')) { throw 'SHA256 output is missing.' }

          $expected = ((Get-Content '.\dist\EbenTiler-Setup.exe.sha256' -Raw).Split()[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash '.\dist\EbenTiler-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer SHA256 mismatch: $actual" }

      - name: Exercise release verification without signing requirement
        shell: powershell
        run: .\tools\verify-release.ps1

      - name: Smoke test install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Upload unsigned CI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbenTiler-Unsigned-CI
          path: |
            dist\EbenTiler-Setup.exe
            dist\EbenTiler-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
