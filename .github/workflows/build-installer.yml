name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/make-appicon.ps1'
      - 'tools/verify-installer.ps1'
      - 'tools/verify-release.ps1'
      - 'tools/verify-local-upgrade.ps1'
      - 'tools/verify-hotkeys.ps1'
      - 'tools/verify-layout-settings.ps1'
      - 'tools/verify-layout-snapshot-read.ps1'
      - 'tools/_testwindow.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - 'LICENSE'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate local upgrade QA helper
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\verify-local-upgrade.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'verify-local-upgrade.ps1 contains PowerShell syntax errors.'
          }

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      # main CI is intentionally unsigned and never receives release signing secrets.
      - name: Build unsigned Tessdeck installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify real hotkeys and split ratio cycling
        shell: powershell
        run: .\tools\verify-hotkeys.ps1

      - name: Verify split ratio settings UI and persistence
        shell: powershell
        run: .\tools\verify-layout-settings.ps1

      - name: Verify layout snapshot parser safety
        shell: powershell
        run: .\tools\verify-layout-snapshot-read.ps1

      - name: Verify installer outputs
        shell: powershell
        run: |
          if (-not (Test-Path '.\dist\Tessdeck-Setup.exe')) { throw 'Installer output is missing.' }
          if (-not (Test-Path '.\dist\Tessdeck-Setup.exe.sha256')) { throw 'SHA256 output is missing.' }

          $expected = ((Get-Content '.\dist\Tessdeck-Setup.exe.sha256' -Raw).Split()[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash '.\dist\Tessdeck-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer SHA256 mismatch: $actual" }

      - name: Exercise release verification without signing requirement
        shell: powershell
        run: .\tools\verify-release.ps1

      - name: Smoke test install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Upload unsigned CI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tessdeck-Unsigned-CI
          path: |
            dist\Tessdeck-Setup.exe
            dist\Tessdeck-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
