name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/make-appicon.ps1'
      - 'tools/verify-installer.ps1'
      - 'tools/verify-release.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - 'LICENSE'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SIGNING_PFX_BASE64: ${{ secrets.EBENTILER_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.EBENTILER_SIGNING_PFX_PASSWORD }}
      EBENTILER_TIMESTAMP_URL: https://timestamp.digicert.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Import code-signing certificate
        if: env.SIGNING_PFX_BASE64 != ''
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'EBENTILER_SIGNING_PFX_PASSWORD is required when a signing certificate is configured.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'ebentiler-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

          try {
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password -Exportable:$false
            if (-not $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              throw 'The code-signing certificate could not be imported.'
            }
            "EBENTILER_SIGNING_CERT_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build EbenTiler installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify installer outputs
        shell: powershell
        run: |
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe')) { throw 'Installer output is missing.' }
          if (-not (Test-Path '.\dist\EbenTiler-Setup.exe.sha256')) { throw 'SHA256 output is missing.' }

          $expected = ((Get-Content '.\dist\EbenTiler-Setup.exe.sha256' -Raw).Split()[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash '.\dist\EbenTiler-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer SHA256 mismatch: $actual" }

      - name: Exercise release verification
        shell: powershell
        run: .\tools\verify-release.ps1

      - name: Smoke test install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbenTiler-Setup
          path: |
            dist\EbenTiler-Setup.exe
            dist\EbenTiler-Setup.exe.sha256
          if-no-files-found: error
