name: 랜딩페이지 배포 묶음 만들기

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/build-website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: 저장소 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 웹 자산과 안전한 다운로드 경로 확인
        shell: powershell
        run: |
          $webpAssets = @(
            '.\website\hero-tessdeck.webp',
            '.\website\thirds-tessdeck.webp'
          )

          foreach ($assetPath in $webpAssets) {
            if (-not (Test-Path $assetPath)) { throw "Web asset is missing: $assetPath" }

            $bytes = [IO.File]::ReadAllBytes($assetPath)
            if ($bytes.Length -lt 1024) { throw "Web asset is unexpectedly small: $assetPath ($($bytes.Length) bytes)" }

            $header = [Text.Encoding]::ASCII.GetString($bytes, 0, 12)
            if (-not ($header.StartsWith('RIFF') -and $header.Substring(8, 4) -eq 'WEBP')) {
              throw "Web asset is not a valid WebP container: $assetPath"
            }
          }

          $index = Get-Content '.\website\index.html' -Raw
          $download = Get-Content '.\website\download.html' -Raw
          $styles = Get-Content '.\website\styles.css' -Raw
          $downloadStyles = Get-Content '.\website\download.css' -Raw
          $app = Get-Content '.\website\app.js' -Raw
          if ($index -notmatch 'hero-tessdeck\.webp') { throw 'Landing page does not reference the hero asset.' }
          if ($styles -notmatch 'thirds-tessdeck\.webp') { throw 'Landing page styles do not reference the thirds asset.' }
          if ($index -notmatch 'href="\.\/download\.html"') {
            throw 'Landing page download buttons do not route through the download guide.'
          }
          if ($download -notmatch 'Windows의 PC 보호' -or $download -notmatch '추가 정보' -or $download -notmatch 'Tessdeck-Setup\.exe') {
            throw 'Download guide is missing the Windows protection instructions or installer link.'
          }
          if ($download -notmatch 'download\.css' -or $downloadStyles -notmatch '\.smartscreen-card' -or $downloadStyles -notmatch '\.install-steps') {
            throw 'Download guide stylesheet is missing or not referenced.'
          }
          if ($app -notmatch 'Eben-Builds/Tessdeck-for-Windows/releases/latest') {
            throw 'Download guide does not route downloads through the Tessdeck GitHub Releases page.'
          }

      - name: 정적 랜딩페이지 묶기
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'tessdeck-site'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item '.\website\*' $target -Recurse -Force
          "TESSDECK_SITE_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 검증된 사이트 묶음 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tessdeck-Website
          path: ${{ env.TESSDECK_SITE_DIR }}
          if-no-files-found: error
          retention-days: 7

  publish-site:
    needs: build-site
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 게시용 저장소 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 검증된 사이트 묶음 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Tessdeck-Website
          path: ${{ runner.temp }}\tessdeck-site

      - name: site 브랜치에 게시
        shell: powershell
        run: |
          $siteDir = Join-Path $env:RUNNER_TEMP 'tessdeck-site'
          if (-not (Test-Path (Join-Path $siteDir 'index.html'))) { throw 'Verified site artifact is missing index.html.' }
          if (-not (Test-Path (Join-Path $siteDir 'download.html'))) { throw 'Verified site artifact is missing download.html.' }
          if (-not (Test-Path (Join-Path $siteDir 'download.css'))) { throw 'Verified site artifact is missing download.css.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan site
          git rm -rf .
          git clean -fdx
          Copy-Item "$siteDir\*" . -Recurse -Force
          git add -A
          git commit -m "Publish landing site $env:GITHUB_SHA"
          git push --force origin site
