name: 랜딩페이지 배포 묶음 만들기

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'src/**'
      - 'assets/**'
      - 'installer/**'
      - 'tools/make-appicon.ps1'
      - 'tools/verify-installer.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - '.github/workflows/build-website.yml'

permissions:
  contents: write

jobs:
  build-site:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SIGNING_PFX_BASE64: ${{ secrets.EBENTILER_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.EBENTILER_SIGNING_PFX_PASSWORD }}
      EBENTILER_TIMESTAMP_URL: https://timestamp.digicert.com

    steps:
      - name: 저장소 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 웹 자산 무결성 확인
        shell: powershell
        run: |
          $heroPath = '.\website\hero-ebentiler.webp'
          if (-not (Test-Path $heroPath)) { throw 'Hero asset is missing.' }

          $bytes = [IO.File]::ReadAllBytes($heroPath)
          if ($bytes.Length -lt 1024) { throw "Hero asset is unexpectedly small: $($bytes.Length)" }

          $header = [Text.Encoding]::ASCII.GetString($bytes, 0, 12)
          if (-not ($header.StartsWith('RIFF') -and $header.Substring(8, 4) -eq 'WEBP')) {
            throw 'Hero asset is not a valid WebP container.'
          }

          $index = Get-Content '.\website\index.html' -Raw
          if ($index -notmatch 'hero-ebentiler\.webp') { throw 'Landing page does not reference the hero asset.' }
          if ($index -notmatch 'EbenTiler-Setup\.exe') { throw 'Landing page does not reference the installer.' }

      - name: 설치 도구 준비
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: 코드 서명 인증서 준비
        if: env.SIGNING_PFX_BASE64 != ''
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'Signing certificate is configured but password is missing.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ebentiler-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password -Exportable:$false
            if (-not $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              throw 'Failed to import the code-signing certificate.'
            }
            "EBENTILER_SIGNING_CERT_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: 최신 설치 파일 만들기
        shell: powershell
        run: .\build-installer.ps1

      - name: 설치 파일 SHA256 확인
        shell: powershell
        run: |
          $expected = ((Get-Content '.\dist\EbenTiler-Setup.exe.sha256' -Raw).Split()[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash '.\dist\EbenTiler-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer SHA256 mismatch: $actual" }

      - name: 설치와 제거 스모크 테스트
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: 랜딩페이지와 설치 파일 묶기
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ebentiler-site'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item '.\website\*' $target -Recurse -Force
          Copy-Item '.\dist\EbenTiler-Setup.exe' (Join-Path $target 'EbenTiler-Setup.exe') -Force
          Copy-Item '.\dist\EbenTiler-Setup.exe.sha256' (Join-Path $target 'EbenTiler-Setup.exe.sha256') -Force
          "EBENTILER_SITE_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 배포용 사이트 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbenTiler-Website
          path: ${{ env.EBENTILER_SITE_DIR }}
          if-no-files-found: error

      - name: 완성된 사이트를 site 브랜치에 게시
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan site
          git rm -rf .
          git clean -fdx
          Copy-Item "$env:EBENTILER_SITE_DIR\*" . -Recurse -Force
          git add -A
          git commit -m "Publish landing site $env:GITHUB_SHA"
          git push --force origin site
