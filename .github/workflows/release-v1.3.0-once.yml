name: Release v1.3.0 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.3.0-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '9a95508dd717afc28ac65a6e3bd6cf442ff31578'
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release target
        shell: powershell
        run: |
          $expected = '9a95508dd717afc28ac65a6e3bd6cf442ff31578'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Release target mismatch. Expected $expected but got $actual."
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $actual origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release target is not contained in origin/main.'
          }

          $assemblyInfo = Get-Content '.\src\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyFileVersion\("1\.3\.0\.0"\)') {
            throw 'AssemblyFileVersion is not 1.3.0.0.'
          }

          $installer = Get-Content '.\installer\Tessdeck.iss' -Raw
          if ($installer -notmatch '#define AppVersion\s+"1\.3\.0"') {
            throw 'Installer AppVersion is not 1.3.0.'
          }

          git ls-remote --exit-code --tags origin refs/tags/v1.3.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'v1.3.0 already exists on origin.'
          }

      - name: Create protected release tag
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.3.0 '9a95508dd717afc28ac65a6e3bd6cf442ff31578' -m "Tessdeck 1.3.0"
          git push origin refs/tags/v1.3.0

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build release installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Verify release artifacts
        shell: powershell
        run: .\tools\verify-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes-v1.3.0.md'
          $notes = @(
            '> [!WARNING]',
            '> 이 릴리스의 설치 파일은 아직 Authenticode 코드 서명이 적용되지 않았습니다. Windows에서 `알 수 없는 게시자` 또는 SmartScreen 경고가 표시될 수 있습니다.',
            '>',
            '> 설치 파일은 GitHub Actions에서 빌드했으며 설치/제거 smoke test와 SHA-256 검증을 통과했습니다. `Tessdeck-Setup.exe.sha256` 파일을 함께 제공합니다.',
            '',
            '## v1.3.0 주요 변경',
            '',
            '- **Quick Layout**: 현재 열려 있는 앱 창들의 위치와 크기를 저장하고 한 번에 복원',
            '- **멀티모니터 복원**: 다른 모니터로 옮긴 창도 저장 당시 모니터와 위치로 복귀',
            '- **DPI 경계 보정**: 모니터 배율이 달라도 이동 후 위치를 재검증하고 보정',
            '- **Quick Layout 단축키**: 설정에서 저장/복원 글로벌 단축키를 직접 지정',
            '- **재시작 유지**: Tessdeck을 다시 실행해도 Quick Layout 단축키 설정 유지',
            '- **로컬·프라이버시 우선**: 창 제목, URL, 파일 경로, 명령줄, 창 내용은 저장하지 않음',
            '',
            '업그레이드 호환성: v1.0.1 / v1.1.0 / v1.1.1 / v1.1.2 / v1.2.0 → v1.3.0 자동 검증 통과.'
          )
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          gh release create v1.3.0 `
            .\dist\Tessdeck-Setup.exe `
            .\dist\Tessdeck-Setup.exe.sha256 `
            --repo "$env:GH_REPO" `
            --verify-tag `
            --title "Tessdeck 1.3.0 (unsigned)" `
            --notes-file $notesPath
