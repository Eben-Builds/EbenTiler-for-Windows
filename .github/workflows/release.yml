name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release source and version
        id: version
        shell: powershell
        run: |
          if ($env:GITHUB_ACTOR -ne $env:GITHUB_REPOSITORY_OWNER) {
            throw "Only the repository owner may trigger a release. Actor: $env:GITHUB_ACTOR"
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit already contained in main.'
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
          }
          $tagVersion = $Matches[1]
          $assemblyInfo = Get-Content '.\src\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyFileVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"\)') {
            throw 'AssemblyFileVersion was not found.'
          }
          $appVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match app version $appVersion."
          }
          "version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      # Signing is optional until a public code-signing identity is connected.
      # Signing secrets are exposed only to this preparation step. The helper
      # exports only the usable certificate thumbprint through GITHUB_ENV for
      # later build/verification steps; PFX material and its password do not
      # remain in the environment of unrelated steps.
      - name: Prepare optional code-signing identity
        id: signing
        shell: powershell
        env:
          EBENTILER_SIGNING_CERT_SHA1: ${{ secrets.EBENTILER_SIGNING_CERT_SHA1 }}
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          .\tools\prepare-code-signing.ps1
          $signed = -not [string]::IsNullOrWhiteSpace($env:EBENTILER_SIGNING_CERT_SHA1)
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($signed) {
            Write-Host 'Release mode: Authenticode signed.'
          } else {
            Write-Warning 'Release mode: unsigned. GitHub Release notes will disclose this clearly.'
          }

      - name: Build release installer
        shell: powershell
        env:
          EBENTILER_TIMESTAMP_URL: https://timestamp.digicert.com
        run: .\build-installer.ps1

      - name: Verify install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Verify release artifacts
        shell: powershell
        run: |
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            .\tools\verify-release.ps1 -RequireCodeSigning
          } else {
            .\tools\verify-release.ps1
          }

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tessdeck-Release
          path: |
            dist\Tessdeck-Setup.exe
            dist\Tessdeck-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-release
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Tessdeck-Release
          path: release-artifacts

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EBENTILER_RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          EBENTILER_RELEASE_SIGNED: ${{ needs.build-release.outputs.signed }}
        run: |
          $installer = '.\release-artifacts\Tessdeck-Setup.exe'
          $checksum = '.\release-artifacts\Tessdeck-Setup.exe.sha256'

          if ($env:EBENTILER_RELEASE_SIGNED -eq 'true') {
            gh release create "$env:GITHUB_REF_NAME" `
              $installer `
              $checksum `
              --repo "$env:GH_REPO" `
              --verify-tag `
              --title "Tessdeck $env:EBENTILER_RELEASE_VERSION" `
              --generate-notes
          } else {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            $notes = @(
              '> [!WARNING]',
              '> 이 릴리스의 설치 파일은 아직 Authenticode 코드 서명이 적용되지 않았습니다. Windows에서 `알 수 없는 게시자` 또는 SmartScreen 경고가 표시될 수 있습니다.',
              '>',
              '> 설치 파일은 이 저장소의 GitHub Actions에서 빌드했으며, 설치/제거 smoke test와 SHA-256 검증을 통과한 결과물입니다. `Tessdeck-Setup.exe.sha256` 파일을 함께 제공합니다.',
              '>',
              '> SignPath Foundation 승인 또는 다른 공개 코드서명 수단이 연결되면 이후 릴리스부터 서명된 설치 파일로 전환할 예정입니다.',
              '',
              "현재 버전: $env:EBENTILER_RELEASE_VERSION"
            )
            Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

            gh release create "$env:GITHUB_REF_NAME" `
              $installer `
              $checksum `
              --repo "$env:GH_REPO" `
              --verify-tag `
              --title "Tessdeck $env:EBENTILER_RELEASE_VERSION (unsigned)" `
              --notes-file $notesPath
          }
