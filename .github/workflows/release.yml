name: Publish Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EBENTILER_SIGNING_CERT_SHA1: ${{ secrets.EBENTILER_SIGNING_CERT_SHA1 }}
      SIGNING_PFX_BASE64: ${{ secrets.EBENTILER_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.EBENTILER_SIGNING_PFX_PASSWORD }}
      EBENTILER_TIMESTAMP_URL: https://timestamp.digicert.com

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release source and version
        id: version
        shell: powershell
        run: |
          if ($env:GITHUB_ACTOR -ne $env:GITHUB_REPOSITORY_OWNER) {
            throw "Only the repository owner may trigger a signed release. Actor: $env:GITHUB_ACTOR"
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit already contained in main.'
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
          }
          $tagVersion = $Matches[1]
          $assemblyInfo = Get-Content '.\src\AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyFileVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"\)') {
            throw 'AssemblyFileVersion was not found.'
          }
          $appVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match app version $appVersion."
          }
          "version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      # Public code-signing private keys should live in a hardware token, HSM,
      # cloud HSM, or signing service. A provider-specific bootstrap may expose
      # the certificate through Cert:\CurrentUser\My and set the thumbprint.
      # Exportable PFX credentials are supported only as a compatibility path.
      - name: Prepare code-signing identity
        shell: powershell
        run: .\tools\prepare-code-signing.ps1 -RequireSigning

      - name: Build signed installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Verify install and uninstall
        shell: powershell
        run: .\tools\verify-installer.ps1

      - name: Verify signed release artifacts
        shell: powershell
        run: .\tools\verify-release.ps1 -RequireCodeSigning

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbenTiler-Signed-Release
          path: |
            dist\EbenTiler-Setup.exe
            dist\EbenTiler-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-release
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EbenTiler-Signed-Release
          path: release-artifacts

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EBENTILER_RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            '.\release-artifacts\EbenTiler-Setup.exe' `
            '.\release-artifacts\EbenTiler-Setup.exe.sha256' `
            --repo "$env:GH_REPO" `
            --verify-tag `
            --title "EbenTiler $env:EBENTILER_RELEASE_VERSION" `
            --generate-notes
