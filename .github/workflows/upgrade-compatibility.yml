name: Upgrade Compatibility Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'installer/**'
      - 'src/AssemblyInfo.cs'
      - 'src/Config.cs'
      - 'src/Startup.cs'
      - 'tools/make-appicon.ps1'
      - 'tools/verify-upgrade.ps1'
      - 'build.ps1'
      - 'build-installer.ps1'
      - '.github/workflows/upgrade-compatibility.yml'

permissions:
  contents: read

jobs:
  published-upgrade:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - from_version: '1.0.1'
            from_asset: 'EbenTiler-Setup.exe'
          - from_version: '1.1.0'
            from_asset: 'Tessdeck-Setup.exe'
          - from_version: '1.1.1'
            from_asset: 'Tessdeck-Setup.exe'
          - from_version: '1.1.2'
            from_asset: 'Tessdeck-Setup.exe'
          - from_version: '1.2.0'
            from_asset: 'Tessdeck-Setup.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build current upgrade target
        shell: powershell
        run: .\build-installer.ps1

      - name: Download published base installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .\upgrade-assets\from -Force | Out-Null
          gh release download "v${{ matrix.from_version }}" --repo "$env:GITHUB_REPOSITORY" --pattern "${{ matrix.from_asset }}" --dir .\upgrade-assets\from

      - name: Verify published upgrade path
        shell: powershell
        run: |
          .\tools\verify-upgrade.ps1 `
            -FromVersion '${{ matrix.from_version }}' `
            -BaseInstaller '.\upgrade-assets\from\${{ matrix.from_asset }}' `
            -TargetInstaller '.\dist\Tessdeck-Setup.exe' `
            -TargetVersion '1.3.0' `
            -OutDir '.\build\upgrade-check'

      - name: Upload upgrade report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Upgrade-${{ matrix.from_version }}-to-1.3.0
          path: build\upgrade-check
          if-no-files-found: warn
          retention-days: 14
